name: Feature Request
description: Propose a new feature (file in the affected repo; most intake comes from Linear)
labels: ["feature"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What feature would you like and why?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable conditions that define done.
      value: |
        - [ ]
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Also apply the matching P0/P1/P2 label.
      options:
        - P2 — Normal
        - P1 — High
        - P0 — Critical
      default: 0
    validations:
      required: false
